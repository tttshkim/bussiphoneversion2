<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Сообщения</title>
  
  <!-- Apple iOS Web App & Home Screen Icon -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Сообщения">
  <meta name="theme-color" content="#000000">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-black: #000000;
      --bg-card: #1c1c1e;
      --bg-card-hover: #262629;
      --bg-bubble-gray: #262629;
      --bg-bubble-green: #34c759;
      --text-white: #ffffff;
      --text-muted: #8e8e93;
      --text-blue: #0a84ff;
      --text-red: #ff453a;
      --divider-color: #2c2c2e;
      --avatar-gradient: radial-gradient(circle at 50% 30%, #58557a 0%, #302d45 100%);
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0b0b0c;
      color: var(--text-white);
      font-family: var(--font-family);
      overflow: hidden;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Screen navigation container */
    .app-viewport {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 932px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg-black);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
      /* Account for iPhone notch / Dynamic Island */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-black);
      display: flex;
      flex-direction: column;
      transition: transform 0.32s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease;
      will-change: transform;
    }

    .screen.hidden-left {
      transform: translateX(-28%);
      opacity: 0.5;
      pointer-events: none;
    }
    .screen.hidden-right {
      transform: translateX(100%);
      pointer-events: none;
    }
    .screen.active {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* =========================================
       SCREEN 1: CONVERSATIONS LIST
       ========================================= */
    .list-header {
      /* Adjust for iPhone notch / Dynamic Island */
      padding: calc(12px + env(safe-area-inset-top)) 18px 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      background: var(--bg-black);
      z-index: 20;
    }

    .pill-btn {
      background: #1c1c1e;
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      padding: 7px 18px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.2px;
      transition: background 0.15s;
    }
    .pill-btn:active {
      background: #2a2a2d;
    }
    .pill-btn.active {
      background: var(--text-blue);
      color: #ffffff;
    }

    .circle-nav-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.15s;
    }
    .circle-nav-btn:active {
      background: #2a2a2d;
    }

    .list-title-wrap {
      padding: 4px 18px 12px 18px;
      flex-shrink: 0;
      background: var(--bg-black);
    }
    .list-title {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.6px;
      line-height: 1.15;
    }

    .chats-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
    }
    .chats-scroll::-webkit-scrollbar {
      display: none;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 10px 18px;
      cursor: pointer;
      position: relative;
      transition: background 0.12s;
    }
    .chat-item:active {
      background: #161618;
    }

    .delete-circle-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--text-red);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      margin-right: 12px;
      flex-shrink: 0;
      border: none;
      cursor: pointer;
      line-height: 1;
    }
    .editing .delete-circle-btn {
      display: flex;
    }

    /* Vector Monogram Avatar */
    .avatar-wrapper {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: hidden;
      margin-right: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--avatar-gradient);
    }
    .avatar-wrapper.badica {
      background: #4a4563;
      color: #ffffff;
      font-size: 23px;
      font-weight: 600;
    }

    .chat-content-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-bottom: 0.5px solid var(--divider-color);
      padding-bottom: 11px;
    }
    .chat-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-name {
      font-size: 16.5px;
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: -0.2px;
    }
    .chat-time-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text-muted);
      font-size: 14.5px;
      font-weight: 400;
    }
    .chevron-right {
      width: 7px;
      height: 12px;
      stroke: #636366;
      stroke-width: 2.2;
      fill: none;
      margin-left: 2px;
    }

    .chat-message-preview {
      font-size: 14.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
      letter-spacing: -0.15px;
    }

    /* List Bottom Dock Bar */
    .list-bottom-bar-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 18px calc(10px + env(safe-area-inset-bottom, 0px)) 18px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
    }
    .search-input-pill {
      flex: 1;
      height: 42px;
      background: #1c1c1e;
      border-radius: 21px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      color: #8e8e93;
    }
    .search-input-pill input {
      flex: 1;
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      user-select: text;
      -webkit-user-select: text;
    }
    .search-input-pill input::placeholder { color: #8e8e93; }
    .search-clear-btn {
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: #636366;
      color: #111;
      font-size: 16px;
      line-height: 22px;
      display: none;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .search-input-pill.has-query .search-clear-btn { display: block; }
    .search-empty {
      padding: 28px 20px;
      color: #8e8e93;
      text-align: center;
      font-size: 14px;
    }
    .compose-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.15s;
    }
    .compose-btn:active {
      background: #2a2a2d;
    }

    /* =========================================
       SCREEN 2: CHAT VIEW (EXACT MATCH TO SCREENSHOT)
       ========================================= */
    /* Frosted blurred gradient header overlay */
    .chat-nav-header-blur-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 95px;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.96) 0%,
        rgba(0, 0, 0, 0.88) 60%,
        rgba(0, 0, 0, 0.5) 85%,
        rgba(0, 0, 0, 0) 100%
      );
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 75%, rgba(0, 0, 0, 0) 100%);
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 75%, rgba(0, 0, 0, 0) 100%);
      z-index: 25;
      pointer-events: none;
    }

    .chat-nav-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      /* Учитываем notch / Dynamic Island */
      padding: calc(10px + env(safe-area-inset-top)) 14px 8px 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      z-index: 30;
      pointer-events: none;
    }

    /* Oval Back Pill with unread badge e.g. < */
    .chat-back-btn-pill {
      height: 36px;
      padding: 0 12px 0 9px;
      border-radius: 18px;
      background: #1c1c1e;
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 4px;
      color: #ffffff;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.15s;
    }
    .chat-back-btn-pill:active {
      background: #2a2a2d;
    }
    .back-badge {
      font-size: 16.5px;
      font-weight: 500;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    .chat-nav-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      pointer-events: auto;
    }

    /* 60px contact icon with purple gradient */
    .chat-top-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #58557a 0%, #302d45 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      z-index: 1;
    }
    .chat-top-avatar.badica {
      background: #4a4563;
      color: #ffffff;
      font-size: 26px;
      font-weight: 600;
    }
    .chat-top-pill {
      background: #1c1c1e;
      padding: 3px 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: -8px;
      z-index: 2;
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      transition: background 0.15s;
    }
    .chat-top-pill:active {
      background: #2a2a2d;
    }
    .chat-top-name {
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.15px;
    }
    .chat-top-chevron {
      width: 6px;
      height: 10px;
      stroke: #8e8e93;
      stroke-width: 2.2;
      fill: none;
    }

    .chat-body-scroll {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding-top: 96px;
      padding-bottom: 74px;
      padding-left: 14px;
      padding-right: 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
      background: #000000;
    }
    .chat-body-scroll::-webkit-scrollbar {
      display: none;
    }

    .chat-date-separator {
      text-align: center;
      font-size: 12px;
      color: #8e8e93;
      margin: 12px 0 8px 0;
      font-weight: 500;
      letter-spacing: -0.1px;
    }

    /* Speech bubbles with authentic iOS tails */
    .bubble {
      max-width: 76%;
      padding: 10px 15px;
      font-size: 17px;
      line-height: 1.36;
      word-wrap: break-word;
      position: relative;
      user-select: text;
      -webkit-user-select: text;
      letter-spacing: -0.25px;
      margin-bottom: 2px;
      isolation: isolate;
    }
    .bubble.incoming {
      align-self: flex-start;
      background: #262629;
      color: #ffffff;
      border-radius: 18px 18px 18px 4px;
      margin-left: 6px;
    }
    .bubble.outgoing {
      align-self: flex-end;
      background: #34c759;
      color: #ffffff;
      border-radius: 18px 18px 4px 18px;
      margin-right: 6px;
    }
    .bubble u {
      text-decoration: underline;
      text-underline-offset: 2.5px;
    }
    .bubble a {
      color: #388bfd;
      text-decoration: underline;
    }

    /* iOS tail for incoming bubble */
    .bubble.incoming::before {
      content: "";
      position: absolute;
      bottom: 0;
      left: -7px;
      width: 14px;
      height: 16px;
      background-color: #262629;
      border-bottom-right-radius: 12px 10px;
      z-index: -2;
    }
    .bubble.incoming::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: -10px;
      width: 10px;
      height: 16px;
      background-color: #000000;
      border-bottom-right-radius: 10px 14px;
      z-index: -1;
    }

    /* iOS tail for outgoing bubble */
    .bubble.outgoing::before {
      content: "";
      position: absolute;
      bottom: 0;
      right: -7px;
      width: 14px;
      height: 16px;
      background-color: #34c759;
      border-bottom-left-radius: 12px 10px;
      z-index: -2;
    }
    .bubble.outgoing::after {
      content: "";
      position: absolute;
      bottom: 0;
      right: -10px;
      width: 10px;
      height: 16px;
      background-color: #000000;
      border-bottom-left-radius: 10px 14px;
      z-index: -1;
    }

    /* Outgoing send animation */
    .bubble.outgoing.msg-fly-in {
      animation: iosMsgFlyIn 0.34s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
      transform-origin: bottom right;
    }

    /* Incoming receive animation */
    .bubble.incoming.msg-fly-in {
      animation: iosMsgFlyInIncoming 0.34s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
      transform-origin: bottom left;
    }

    @keyframes iosMsgFlyIn {
      0% {
        opacity: 0;
        transform: translateY(32px) scale(0.7);
      }
      65% {
        opacity: 1;
        transform: translateY(-2px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes iosMsgFlyInIncoming {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.75);
      }
      65% {
        opacity: 1;
        transform: translateY(-2px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .ticket-date {
      text-decoration: underline;
    }

    .message-delete-btn {
      position: absolute; top: -8px; right: -7px; z-index: 6;
      width: 23px; height: 23px; border: 0; border-radius: 50%;
      background: #ff453a; color: white; font-size: 17px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transform: scale(.85);
      transition: opacity .16s ease, transform .16s ease;
      box-shadow: 0 2px 8px #0008;
    }
    .bubble, .voice-message, .attachment-message { position: relative; }
    .bubble:hover .message-delete-btn,
    .voice-message:hover .message-delete-btn,
    .attachment-message:hover .message-delete-btn,
    .message-delete-btn:focus-visible { opacity: 1; transform: scale(1); }
    @media (hover: none) { .message-delete-btn { opacity: .95; transform: none; } }


    /* =========================================
       AUTHENTIC INPUT DOCK (Single-row SMS)
       ========================================= */
    .chat-input-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 8px 12px 24px 12px;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 40;
    }

    .plus-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #1c1c1e;
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 300;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .plus-btn:active {
      background: #2a2a2d;
    }

    .text-input-card {
      flex: 1;
      height: 40px;
      background: #1c1c1e;
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 0 8px 0 14px;
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      gap: 6px;
    }

    .text-input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      user-select: text;
      -webkit-user-select: text;
    }
    .text-input-field::placeholder {
      color: #8e8e93;
    }

    .audio-mic-btn {
      background: transparent;
      border: none;
      color: #8e8e93;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .send-msg-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-bubble-green);
      border: none;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      flex-shrink: 0;
    }
    .send-msg-btn:active {
      transform: scale(0.85);
    }

    .home-indicator-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 50;
    }
    .home-indicator {
      width: 135px;
      height: 5px;
      background: #ffffff;
      opacity: 0.55;
      border-radius: 3px;
    }

    /* =========================================
       SCREEN 3: CONTACT PROFILE (EXACT MATCH)
       ========================================= */
    .profile-nav-header {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      z-index: 10;
      flex-shrink: 0;
    }
    .profile-back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1c1c1e;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.15s;
    }
    .profile-back-btn:active {
      background: #2a2a2d;
    }

    .chat-sms-badge {
      text-align: center;
      font-size: 12px;
      color: #8e8e93;
      margin-top: 4px;
      margin-bottom: 2px;
      font-weight: 500;
    }
    .profile-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 6px 16px calc(36px + env(safe-area-inset-bottom, 0px)) 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-overflow-scrolling: touch;
    }
    .profile-scroll::-webkit-scrollbar {
      display: none;
    }

    .profile-avatar-large {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      overflow: hidden;
      margin-top: 4px;
      margin-bottom: 12px;
      background: var(--avatar-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-avatar-large.badica {
      background: #4a4563;
      color: #ffffff;
      font-size: 40px;
      font-weight: 600;
    }
    .profile-name {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 18px;
      letter-spacing: -0.4px;
      text-align: center;
    }

    .profile-quick-actions {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .quick-action-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #262629;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d1d1d6;
      cursor: pointer;
      transition: background 0.15s;
    }
    .quick-action-btn:active {
      background: #38383e;
    }

    .profile-group-card {
      width: 100%;
      background: var(--bg-card);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    // Repair ticket messages saved by older versions as HTML-like text.
    // Convert them to structured fields once, so tags can never appear in the chat bubble.
    function decodeTicketText(value) {
      let raw = String(value || "");
      const decoder = document.createElement("textarea");
      for (let i = 0; i < 4; i++) {
        decoder.innerHTML = raw;
        const decoded = decoder.value;
        if (decoded === raw) break;
        raw = decoded;
      }
      return raw
        .replace(/<br\s*\/?\s*>/gi, "\n")
        .replace(/<\/div\s*>/gi, "\n")
        .replace(/<div\b[^>]*>/gi, "")
        .replace(/<\/?span\b[^>]*>/gi, "")
        .replace(/<\/?u\s*>/gi, "")
        .replace(/<[^>]*>/g, "")
        .replace(/\r/g, "")
        .split("\n")
        .map(line => line.trim())

          const company = lines.find(line => /^IM\s+(?:RTEC|IPUA)$/i.test(line));
          const ticketLine = lines.find(line => /Bilet\s+Nr/i.test(line));
          const date = lines.find(line => /^\d{2}\.\d{2}\.\d{4}\s+\d{2}:\d{2}$/.test(line));
          const priceLine = lines.find(line => /^Pret\b/i.test(line));
          const boardLine = lines.find(line => /^Bord\b/i.test(line));
          if (!company && !ticketLine) return;
          msg.type = "ticket";
          msg.company = company || "IM RTEC";
          msg.ticketNumber = ticketLine ? ticketLine.replace(/^.*?Bilet\s+Nr\s*/i, "").trim() : "";
          msg.ticketDate = date || "";
          msg.price = priceLine ? priceLine.replace(/^Pret\s*/i, "").trim() : "7 MDL";
          msg.board = boardLine ? boardLine.replace(/^Bord\s*/i, "").trim() : "";
          delete msg.text;
          changed = true;
        });
      });
      if (changed) saveChats();
    }

      const newChat = {

    function deleteMessage(chatId, messageIndex) {
      const chat = chats.find(item => item.id === chatId);
      if (!chat || !chat.messages || !chat.messages[messageIndex]) return;
      if (!confirm("Удалить это сообщение?")) return;
      chat.messages.splice(messageIndex, 1);
      const lastMessage = [...chat.messages].reverse().find(item => item.type !== "separator");
      if (lastMessage) {
        chat.preview = lastMessage.type === "ticket" ? `Bilet Nr ${lastMessage.ticketNumber}` :
          lastMessage.type === "voice" ? "🎤 Голосовое сообщение" :
          lastMessage.type === "attachment" ? `📎 ${lastMessage.name || "Вложение"}` :
          String(lastMessage.text || "Сообщение").replace(/<[^>]*>/g, " ").slice(0, 80);
      } else chat.preview = "";
      saveChats();
      renderChatsList();
      if (currentChatId === chatId) renderChatMessages(chat);
    }

    function decodeLegacyTicketMarkup(value) {
      let raw = String(value || "");
      // Some older saves contain escaped HTML entities rather than actual tags.
      const decoder = document.createElement("textarea");
      decoder.innerHTML = raw;
      if (raw.includes("&lt;")) raw = decoder.value;
      return raw;
    }

    function renderLegacyTicket(raw, bubble) {
      const decoded = decodeLegacyTicketMarkup(raw);
      const parsed = new DOMParser().parseFromString(`<div>${decoded}</div>`, "text/html").body.firstElementChild;
      const safeAppend = (node, parent) => {
        if (node.nodeType === Node.TEXT_NODE) parent.appendChild(document.createTextNode(node.nodeValue));
        else if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "BR") parent.appendChild(document.createElement("br"));
        else if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "SPAN" && node.classList.contains("ticket-date")) {
          const span = document.createElement("span");
          span.className = "ticket-date";
          node.childNodes.forEach(child => safeAppend(child, span));
          parent.appendChild(span);
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          node.childNodes.forEach(child => safeAppend(child, parent));
        }
      };
      parsed.childNodes.forEach(node => safeAppend(node, bubble));
    }

            const lines = decodeTicketText(raw);
            lines.forEach((line, index) => {

              b.appendChild(document.createTextNode(line));

          } else {
            b.textContent = raw;

          attachMessageDeleteButton(b, data.id, messageIndex);

          const play = document.createElement("button"); play.className = "voice-play"; play.type = "button"; play.textContent = "▶"; play.setAttribute("aria-label", "Воспроизвести голосовое сообщение");
          const wave = document.createElement("div"); wave.className = "voice-wave"; wave.setAttribute("role", "slider"); wave.setAttribute("aria-label", "Позиция воспроизведения"); wave.tabIndex = 0;
          for (let i=0;i< 32;i++) { const bar=document.createElement("span"); const h=7 + ((i*17 + (i%5)*9 + 11)%24); bar.style.setProperty("--h", `${h}px`); wave.appendChild(bar); }
          const time = document.createElement("span"); time.className = "voice-time"; time.textContent = msg.duration || "0:00";
          const formatTime = value => { if (!Number.isFinite(value)) return "0:00"; const m=Math.floor(value/60), sec=Math.floor(value%60); return `${m}:${String(sec).padStart(2,"0")}`; };
          const updateWave = () => { const ratio=player.duration ? player.currentTime/player.duration : 0; [...wave.children].forEach((bar,i)=>bar.classList.toggle("played", i/ 32 < ratio)); time.textContent = player.duration ? formatTime(player.currentTime) : (msg.duration || "0:00"); };
          play.addEventListener("click", () => { if(player.paused) player.play().catch(()=>{}); else player.pause(); });
          player.addEventListener("play",()=>play.textContent="Ⅱ"); player.addEventListener("pause",()=>play.textContent="▶");
          player.addEventListener("timeupdate",updateWave); player.addEventListener("loadedmetadata",()=>{time.textContent=formatTime(player.duration);}); player.addEventListener("ended",()=>{play.textContent="▶"; player.currentTime=0; updateWave();});
          const seek = event => { if(!player.duration) return; const rect=wave.getBoundingClientRect(); const x=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)); player.currentTime=x*player.duration; updateWave(); };
          wave.addEventListener("click",seek); wave.addEventListener("keydown",event=>{if(event.key==="ArrowRight"||event.key==="ArrowLeft"){event.preventDefault();player.currentTime=Math.max(0,Math.min(player.duration||0,player.currentTime+(event.key==="ArrowRight"?5:-5)));updateWave();}});
          controls.append(play,wave,time); b.append(player,controls); attachMessageDeleteButton(b, data.id, messageIndex); container.appendChild(b);
        } else if (msg.type === "attachment") {
          const b = document.createElement("div");
          b.className = `attachment-message ${msg.direction || "outgoing"}`;
          if (msg.kind === "image") {
            const img = document.createElement("img");

          } else if (msg.kind === "audio") {

          } else {
            const link = document.createElement("a");

          const caption = document.createElement("div");
          caption.className = "attachment-caption";
          caption.textContent = msg.name || "Вложение";
          b.appendChild(caption);
          container.appendChild(b);
        } else if (msg.type === "outgoing") {
          const b = document.createElement("div");
          b.className = "bubble outgoing";
          b.innerText = msg.text;
          container.appendChild(b);
        }
      });

      setTimeout(() => {
        container.scrollTop = container.scrollHeight;
      }, 30);
    }

    // Audio sound for outgoing SMS
    function playIosSendSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const now = ctx.currentTime;

        osc.type = "sine";
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(920, now + 0.13);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.19);
      } catch (e) {}
    }

    // Audio sound for incoming SMS (iOS chime)
    function playIosReceiveSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;

        // Note 1: E5 (659.25 Hz)
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = "sine";
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.001, now);
        gain1.gain.linearRampToValueAtTime(0.14, now + 0.02);
        gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.19);

        // Note 2: A5 (880 Hz)
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(880, now + 0.11);
        gain2.gain.setValueAtTime(0.001, now + 0.11);
        gain2.gain.linearRampToValueAtTime(0.18, now + 0.13);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.38);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.11);
        osc2.stop(now + 0.39);
      } catch (e) {}
    }

    // Bot simulator for shortcode 4000 (Chisinau transport ticketing)
    function triggerBot4000(chat, userText) {
      setTimeout(() => {
        const cleanText = (userText || "").trim();
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const timeStr = `${hours}:${minutes}`;

        let responseMessage = null;
        let previewText = "";

        // Check if message consists of digits (board number)
        if (/^\d+$/.test(cleanText)) {
          // If strictly 3 digits -> IM IPUA (Bus), otherwise IM RTEC (Trolleybus)
          const companyHeader = /^\d{3}$/.test(cleanText) ? 'IM IPUA' : 'IM RTEC';
          const randomNum = Math.floor(100000 + Math.random() * 900000);
          const ticketNumber = `MCT-000${randomNum}`;

          const dd = String(now.getDate()).padStart(2, '0');
          const mm = String(now.getMonth() + 1).padStart(2, '0');
          const yyyy = now.getFullYear();
          const dateTimeStr = `${dd}.${mm}.${yyyy} ${timeStr}`;

          responseMessage = {
            type: "ticket",
            company: companyHeader,
            ticketNumber,
            ticketDate: dateTimeStr,
            price: "7 MDL",
            board: cleanText
          };
          previewText = `Bilet Nr ${ticketNumber}`;
        } else {
          responseMessage = { type: "incoming", text: "Textul SMS este incorect. Introdu 3 cifre pentru codul autobuzului sau 4 cifre pentru codul troleibuzului." };
          previewText = responseMessage.text;
        }

        if (!chat.messages) chat.messages = [];
        chat.messages.push(responseMessage);
        chat.preview = previewText;
        chat.time = timeStr;

        // Move chat to top of the list
        const chatIndex = chats.findIndex(c => c.id === chat.id);
        if (chatIndex > -1) {
          chats.splice(chatIndex, 1);
          chats.unshift(chat);
        }

        saveChats();
        renderChatsList();

        // If currently viewing this chat, play sound and append bubble
        if (currentChatId === chat.id) {
          playIosReceiveSound();
          const container = document.getElementById("chatMessagesContainer");
          if (container) {
            renderChatMessages(chat);
            const newest = container.lastElementChild;
            if (newest) newest.classList.add("msg-fly-in");
            setTimeout(() => container.scrollTo({ top: container.scrollHeight, behavior: "smooth" }), 10);
          }
        }
      }, 700);
    }

    // Media, speech-to-text and message sending
    const inputField = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const audioBtn = document.getElementById("audioBtn");
    const voiceRecordBtn = document.getElementById("voiceRecordBtn");
    const plusButton = document.getElementById("plusBtn");
    const attachmentInput = document.getElementById("attachmentInput");
    let mediaRecorder = null;
    let recordingChunks = [];
    let recordingStartedAt = 0;
    let recordingChatId = null;
    let speechRecognition = null;

    function updateComposerButtons() {
      const hasText = inputField.value.trim().length > 0;
      sendBtn.style.display = hasText ? "flex" : "none";
      audioBtn.style.display = hasText ? "none" : "flex";
      voiceRecordBtn.style.display = hasText ? "none" : "flex";
    }
    inputField.addEventListener("input", updateComposerButtons);
    inputField.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
    updateComposerButtons();

    function updateChatAfterMedia(chat, preview) {
      const now = new Date();
      chat.time = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
      chat.preview = preview;
      const i = chats.findIndex(c => c.id === chat.id);
      if (i > 0) { chats.splice(i, 1); chats.unshift(chat); }
      saveChats();
      renderChatsList();
      if (currentChatId === chat.id) renderChatMessages(chat);
    }

    attachmentInput.addEventListener("change", () => {
      const file = attachmentInput.files && attachmentInput.files[0];
      attachmentInput.value = "";
      if (!file || !currentChatId) return;
      if (file.size > 2 * 1024 * 1024) { alert("Файл слишком большой. Максимальный размер — 2 МБ."); return; }
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;
      const reader = new FileReader();
      reader.onload = () => {
        const kind = file.type.startsWith("image/") ? "image" : file.type.startsWith("video/") ? "video" : file.type.startsWith("audio/") ? "audio" : "file";
        if (!chat.messages) chat.messages = [];
        chat.messages.push({type:"attachment", direction:"outgoing", kind, name:file.name, data:reader.result});
        updateChatAfterMedia(chat, `📎 ${file.name}`);
      };
      reader.onerror = () => alert("Не удалось прочитать файл.");
      reader.readAsDataURL(file);
    });

    // Speech recognition inserts dictated words into the text field (not an audio file).
    function startSpeechInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Голосовой ввод текста не поддерживается этим браузером. Открой сайт в Google Chrome или Microsoft Edge.");
        return;
      }
      if (speechRecognition) { try { speechRecognition.stop(); } catch (_) {} speechRecognition = null; return; }
      const recognition = new SpeechRecognition();
      speechRecognition = recognition;
      recognition.lang = "ru-RU";
      recognition.interimResults = true;
      recognition.continuous = false;
      let finalText = "";
      const originalText = inputField.value.trim();
      audioBtn.classList.add("listening");
      recognition.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const phrase = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += phrase;
          else interim += phrase;
        }
        const dictated = [finalText, interim].filter(Boolean).join(" ").trim();
        inputField.value = [originalText, dictated].filter(Boolean).join(originalText ? " " : "");
        updateComposerButtons();
      };
      recognition.onerror = (event) => {
        if (event.error !== "no-speech" && event.error !== "aborted") alert("Не удалось распознать речь. Проверь разрешение на микрофон.");
      };
      recognition.onend = () => {
        audioBtn.classList.remove("listening");
        if (speechRecognition === recognition) speechRecognition = null;
        inputField.focus();
      };
      try { recognition.start(); }
      catch (error) { audioBtn.classList.remove("listening"); speechRecognition = null; alert("Не удалось запустить голосовой ввод. Попробуй ещё раз."); }
    }
    audioBtn.addEventListener("click", startSpeechInput);

    // Audio recording remains available as a separate voice-message action.
    async function toggleVoiceRecording() {
      if (!currentChatId) return;
      if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.stop(); return; }
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        alert("Запись аудио не поддерживается. Открой сайт через HTTPS или localhost в современном браузере."); return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        recordingChunks = [];
        recordingChatId = currentChatId;
        const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "";
        mediaRecorder = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined);
        recordingStartedAt = Date.now();
        mediaRecorder.ondataavailable = event => { if (event.data?.size) recordingChunks.push(event.data); };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(track => track.stop());
          voiceRecordBtn.classList.remove("recording");
          const blob = new Blob(recordingChunks, {type:mediaRecorder.mimeType || "audio/webm"});
          const duration = Math.max(1, Math.round((Date.now() - recordingStartedAt) / 1000));
          const chat = chats.find(c => c.id === recordingChatId);
          if (!chat || !blob.size) return;
          if (blob.size > 2 * 1024 * 1024) { alert("Запись слишком большая (лимит 2 МБ). Запиши более короткое сообщение."); return; }
          const reader = new FileReader();
          reader.onload = () => {
            if (!chat.messages) chat.messages = [];
            chat.messages.push({type:"voice", direction:"outgoing", data:reader.result, duration:`${duration} сек.`});
            updateChatAfterMedia(chat, "🎤 Голосовое сообщение");
          };
          reader.readAsDataURL(blob);
        };
        mediaRecorder.start();
        voiceRecordBtn.classList.add("recording");
      } catch (error) {
        alert(error.name === "NotAllowedError" ? "Нет доступа к микрофону. Разреши его в настройках браузера." : "Не удалось начать запись. Проверь микрофон.");
      }
    }
    voiceRecordBtn.addEventListener("click", toggleVoiceRecording);

    function sendMessage() {
      const messageText = inputField.value.trim();
      if (!messageText || !currentChatId) return;
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;
      if (!Array.isArray(chat.messages)) chat.messages = [];
      chat.messages.push({type:"outgoing", text:messageText});
      chat.preview = messageText;
      const now = new Date();
      chat.time = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
      const index = chats.findIndex(c => c.id === chat.id);
      if (index > 0) { chats.splice(index, 1); chats.unshift(chat); }
      saveChats();
      inputField.value = "";
      updateComposerButtons();
      playIosSendSound();
      renderChatMessages(chat);
      renderChatsList();
      const isBot4000 = chat.id === "4000" || String(chat.title).trim() === "4000" || (chat.phone && String(chat.phone).includes("4000"));
      if (isBot4000 && typeof triggerBot4000 === "function") triggerBot4000(chat, messageText);
    }
    window.sendMessage = sendMessage;
    sendBtn.addEventListener("click", (event) => { event.preventDefault(); sendMessage(); });

    // Enter key support for modal inputs
    document.querySelectorAll(".modal-input").forEach(inp => {
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          saveNewContact();
        }
      });
    });

    // Live contact search by display name, phone number, or recent message.
    const contactSearchInput = document.getElementById("contactSearchInput");
    const clearContactSearch = document.getElementById("clearContactSearch");
    contactSearchInput.addEventListener("input", renderChatsList);
    clearContactSearch.addEventListener("click", () => {
      contactSearchInput.value = "";
      renderChatsList();
      contactSearchInput.focus();
    });

    // Initial render
    renderChatsList();
    history.replaceState({screen:"list"}, "");
    // Open 4000 chat immediately on start
    openChat("4000");
  </script>
</body>
</html>
